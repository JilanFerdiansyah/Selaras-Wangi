        const figure=element('figure','collection-perfume');
        const caption=element('figcaption','',perfume.name); caption.title=label(perfume);
        figure.append(productImage(perfume),caption); collection.append(figure);
      });
      resultVisual.append(heading,collection);
      resultTitle.textContent=profileResult.title; resultTitle.tabIndex=-1;
      resultExplanation.textContent=ScentMatcher.explain(profileResult,noteName);
      noteComparison.replaceChildren();
      if(profileResult.available) noteComparison.append(
        noteGroup('Shared with your favorites',profileResult.shared,'shared-group','No shared notes listed.'),
        noteGroup('New in this perfume',profileResult.different,'','All its listed notes appear somewhere in your favorites.')
      );
      const omitted=profileResult.profile.excluded.length;
      resultFootnote.textContent=omitted?`Based on ${profileResult.contributingCount} favorites with listed notes; ${omitted} ${omitted===1?'favorite has':'favorites have'} no note data. Try on skin to judge the scent.`:
        'Based on listed notes. Try on skin to judge the scent.';
    }
    function prepareResults() {
      step=3; center.classList.remove('step-two'); center.classList.add('step-three');
      document.getElementById('stepLabel').textContent='03 · Your comparison';
      results.hidden=false; compareAction.hidden=true; sceneFavorites=[]; renderResult();
      app.scrollTop=0; center.scrollTop=0;
    }
    function motionFrames(duration,draw) {
      return new Promise(resolve=>{
        let began;
        function frame(now) {
          if(began===undefined) began=now;
          const progress=reducedMotion.matches?1:Math.min((now-began)/duration,1);
          draw(progress);
          if(progress<1) requestAnimationFrame(frame); else resolve();
        }
        requestAnimationFrame(frame);
      });
    }
    async function showResults() {
      if(comparing || !target || favorites.length<2) return;
      profileResult=ScentMatcher.assess(target,favorites);
      if(profileResult.selectedCount<2) return;
      if(reducedMotion.matches) { prepareResults(); focusSearch(); return; }
      comparing=true;
      clearTimeout(transitionTimer); clearTimeout(entranceTimer);
      closeSuggestions(); input.blur();
      center.classList.remove('is-entering','is-exiting');
      clearTimeout(revealTimer); results.classList.remove('is-revealing');
      const overlay=element('div','comparison-transition');
      const status=element('p','comparison-status','Comparing notes');
      status.setAttribute('role','status'); status.tabIndex=-1;
      const bounds=app.getBoundingClientRect();
      const sourceNodes=[scentScene.querySelector('.scene-target'),...sceneFavorites];
      const bottles=sourceNodes.map((source,index)=>{
        const rect=source.getBoundingClientRect();
        const bottle=element('div','comparison-bottle'); bottle.setAttribute('aria-hidden','true');
        const image=source.querySelector('.product-image');
        bottle.append(image.matches('.is-loaded, .is-error')?image.cloneNode(true):productImage(index===0?target:favorites[index-1]));
        overlay.append(bottle);
        return {el:bottle,x:rect.left-bounds.left+rect.width/2,y:rect.top-bounds.top+rect.height/2,size:rect.width};
      });
      function position(bottle,x,y,size,opacity=1) {
        bottle.el.style.width=size+'px'; bottle.el.style.height=size+'px';
        bottle.el.style.transform=`translate3d(${x-size/2}px,${y-size/2}px,0)`;
        bottle.el.style.opacity=opacity;
        bottle.x=x; bottle.y=y; bottle.size=size;
      }
      bottles.forEach(bottle=>position(bottle,bottle.x,bottle.y,bottle.size));
      const origins=bottles.map(({x,y,size})=>({x,y,size}));
      const cx=app.clientWidth/2, cy=app.clientHeight*.4;
      const rx=Math.min(app.clientWidth*.4,180), ry=Math.min(app.clientHeight*.15,112);
      const phase=favoritePhase;
      overlay.append(status); app.append(overlay);
      center.inert=true; center.classList.add('is-comparing'); status.focus({preventScroll:true});
      status.style.top=(cy+ry+52)+'px';
      try {
        await motionFrames(2800,progress=>{
          const ease=progress*progress*(3-2*progress);
          const arrive=Math.min(progress/.3,1);
          const blend=arrive*arrive*(3-2*arrive);
          position(bottles[0],origins[0].x+(cx-origins[0].x)*blend,origins[0].y+(cy-origins[0].y)*blend,origins[0].size);
          bottles.slice(1).forEach((bottle,index)=>{
            const angle=-Math.PI/2+index*Math.PI*2/favorites.length+phase+ease*Math.PI*1.2;
            const origin=origins[index+1];
            position(bottle,origin.x+(cx+rx*Math.cos(angle)-origin.x)*blend,origin.y+(cy+ry*Math.sin(angle)-origin.y)*blend,origin.size);
          });
        });
        prepareResults();
        const destinations=[...resultVisual.querySelectorAll('.product-image')].map(image=>{
          const rect=image.getBoundingClientRect();
          return {x:rect.left-bounds.left+rect.width/2,y:rect.top-bounds.top+rect.height/2,size:rect.width};
        });
        const settled=bottles.map(({x,y,size})=>({x,y,size}));
        await motionFrames(1100,progress=>{
          const ease=progress*progress*(3-2*progress);
          status.style.opacity=1-progress;
          bottles.forEach((bottle,index)=>{
            const destination=destinations[index];
            const origin=settled[index];
            if(destination) position(bottle,origin.x+(destination.x-origin.x)*ease,origin.y+(destination.y-origin.y)*ease,origin.size+(destination.size-origin.size)*ease);
            else position(bottle,origin.x,origin.y,origin.size,1-progress);
          });
        });
      } finally {
        overlay.remove(); center.inert=false; center.classList.remove('is-comparing'); comparing=false;
        if(step!==3) prepareResults();
        if(!reducedMotion.matches) {
          results.classList.add('is-revealing');
          revealTimer=setTimeout(()=>results.classList.remove('is-revealing'),1100);
        }
        focusSearch();
      }
    }
    let searchLayoutFrame;
    function setSearchOpen(open) {
      if(app.classList.contains('search-open')===open) return;
      app.classList.toggle('search-open',open);
      cancelAnimationFrame(searchLayoutFrame);
      const began=performance.now();
      function measure(now) {
        updateSuggestionsRoom();
        if(!reducedMotion.matches && now-began<600) searchLayoutFrame=requestAnimationFrame(measure);
      }
      searchLayoutFrame=requestAnimationFrame(measure);
    }
    function closeSuggestions() { setSearchOpen(false); suggestions.hidden = true; input.setAttribute('aria-expanded','false'); input.removeAttribute('aria-activedescendant'); activeIndex = -1; }
    function renderSuggestions() {
      const q = normalize(input.value);
      clearSearch.classList.toggle('visible', !!input.value.trim());
      if (!q && window.innerWidth>700) { closeSuggestions(); return; }
      matches = perfumes.map((p,index)=>({p,index,score:q?matchScore(p,q):0}))
        .filter(result=>result.score!==null && !(step===2 && (result.p===target || favorites.includes(result.p))))
        .sort((a,b)=>a.score-b.score || a.index-b.index).slice(0,6).map(result=>result.p);
      suggestions.innerHTML = '';
      if (!matches.length) { const li=document.createElement('li'); li.className='empty'; li.textContent=perfumes.length?'No match. Try a brand or a shorter name.':'The perfume catalog couldn’t load. Reload to try again.'; suggestions.appendChild(li); }
      matches.forEach((p,i)=>{
        const li=document.createElement('li'); const button=document.createElement('button');
        button.type='button'; button.id=`perfume-option-${i}`; button.setAttribute('role','option'); button.setAttribute('aria-selected',String(i===activeIndex));
        const image=productImage(p,'suggestion-image');
        const names=document.createElement('span'); names.className='suggestion-copy';
        const brand=document.createElement('small'); brand.textContent=p.brand;
        const name=document.createElement('span'); name.className='suggestion-name'; name.textContent=p.name;
        const meta=document.createElement('span'); meta.className='suggestion-meta'; meta.textContent=[p.concentration,formatPrice(p.price_idr)].filter(Boolean).join(' · ');
        names.append(brand,name,meta);
        button.append(image,names); button.addEventListener('click',()=>selectPerfume(p)); li.appendChild(button); suggestions.appendChild(li);
      });
      suggestions.hidden=false; setSearchOpen(true); input.setAttribute('aria-expanded','true');
      if(activeIndex>=0) {
        input.setAttribute('aria-activedescendant',`perfume-option-${activeIndex}`);
        const option=document.getElementById(`perfume-option-${activeIndex}`).parentElement;
        if(option.offsetTop<suggestions.scrollTop) suggestions.scrollTop=option.offsetTop;
        else if(option.offsetTop+option.offsetHeight>suggestions.scrollTop+suggestions.clientHeight) suggestions.scrollTop=option.offsetTop+option.offsetHeight-suggestions.clientHeight;
      }
      else input.removeAttribute('aria-activedescendant');
      updateSuggestionsRoom();
    }
    function selectPerfume(p) {
      userEngaged=false; updateFocusState();
      if (step===1) {
        input.value=''; clearSearch.classList.remove('visible');
        transitionQuestion(() => {
          target=p; favorites=favorites.filter(favorite=>favorite.id!==p.id); favoritePhase=0; step=2; center.classList.add('step-two'); app.classList.add('has-selection');
          document.getElementById('stepLabel').textContent='02 · Your favorites';
          renderTarget();
          question.textContent='Which perfumes do you already love?';
          promise.textContent='Choose two to five scents you love.';
          input.placeholder='Search a perfume you love'; input.setAttribute('aria-label','Search a perfume you love'); input.disabled=false;
          renderFavorites();
        });
      } else {
        if (favorites.length >= maxFavorites) return;
        favorites.push(p); renderFavorites();
        input.value=''; clearSearch.classList.remove('visible'); closeSuggestions();
        if (favorites.length < maxFavorites && window.innerWidth>700) input.focus({preventScroll:true});
        else input.blur();
      }
    }
    searchWrap.addEventListener('pointerdown',()=>{ userEngaged=true; });
    document.querySelector('.search').addEventListener('click',e=>{ if (!e.target.closest('button')) { input.focus(); if(window.innerWidth<=700) { renderSuggestions(); updateMobileViewport(); } } });
    input.addEventListener('focus',()=>{ if(window.innerWidth<=700) { setSearchOpen(true); renderSuggestions(); } updateFocusState(); updateMobileViewport(); });
    input.addEventListener('blur',()=>{ updateFocusState(); setTimeout(updateMobileViewport,80); });
    input.addEventListener('input',()=>{ userEngaged=true; updateFocusState(); activeIndex=-1; renderSuggestions(); updateMobileViewport(); });
    input.addEventListener('keydown',e=>{
      userEngaged=true; updateFocusState();
      if (e.key==='Escape') { closeSuggestions(); input.blur(); return; }
      if (e.key==='ArrowDown' && !suggestions.hidden && matches.length) { e.preventDefault(); activeIndex=(activeIndex+1)%matches.length; renderSuggestions(); }
      if (e.key==='ArrowUp' && !suggestions.hidden && matches.length) { e.preventDefault(); activeIndex=(activeIndex-1+matches.length)%matches.length; renderSuggestions(); }
      if (e.key==='Enter' && !suggestions.hidden && matches.length) { e.preventDefault(); selectPerfume(matches[Math.max(activeIndex,0)]); }
    });
    document.getElementById('closePerfumeSearch').addEventListener('click',()=>{ closeSuggestions(); input.blur(); question.tabIndex=-1; question.focus({preventScroll:true}); });
    clearSearch.addEventListener('click',()=>{ input.value=''; renderSuggestions(); input.focus(); });
    document.addEventListener('pointerdown',e=>{ if (!e.target.closest('.search-wrap')) closeSuggestions(); });
    function changeTarget() {
      userEngaged=false; updateFocusState();
      transitionQuestion(() => {
        target=null; step=1; results.hidden=true; center.classList.remove('step-two','step-three'); app.classList.remove('has-selection'); question.textContent='Which perfume caught your eye?';
        promise.textContent='See how it fits the perfumes you already love.';
        input.placeholder='Search Indonesian perfumes'; input.setAttribute('aria-label','Search Indonesian perfumes'); input.value=''; input.disabled=false; renderTarget(); renderFavorites();
      });
    }
    back.addEventListener('click',changeTarget);
    document.getElementById('changeResultTarget').addEventListener('click',changeTarget);
    compareAction.addEventListener('click',showResults);
    function prepareFavorites() {
      step=2; results.hidden=true; center.classList.remove('step-three'); center.classList.add('step-two');
      document.getElementById('stepLabel').textContent='02 · Your favorites'; renderFavorites();
      scentScene.classList.add('is-restored');
      app.scrollTop=0; center.scrollTop=0;
    }
    async function editFavorites() {
      if(comparing || step!==3) return;
      clearTimeout(transitionTimer); clearTimeout(entranceTimer); clearTimeout(revealTimer);
      center.classList.remove('is-entering','is-exiting'); results.classList.remove('is-revealing');
      closeSuggestions();
      if(reducedMotion.matches) { prepareFavorites(); focusSearch(); return; }
      comparing=true;
      const bounds=app.getBoundingClientRect();
      const overlay=element('div','comparison-transition favorites-transition');
      overlay.setAttribute('aria-hidden','true');
      const bottles=[...resultVisual.querySelectorAll('.product-image')].map((image,index)=>{
        const rect=image.getBoundingClientRect();
        const bottle=element('div','comparison-bottle');
        bottle.append(image.matches('.is-loaded, .is-error')?image.cloneNode(true):productImage(index===0?target:favorites[index-1]));
        bottle.querySelector('img').style.transform='none';
        bottle.style.width=rect.width+'px'; bottle.style.height=rect.height+'px';
        bottle.style.transform=`translate3d(${rect.left-bounds.left}px,${rect.top-bounds.top}px,0)`;
        overlay.append(bottle);
        return {el:bottle,x:rect.left-bounds.left+rect.width/2,y:rect.top-bounds.top+rect.height/2,size:rect.width};
      });
      app.append(overlay); center.inert=true; center.classList.add('is-returning');
      try {
        await motionFrames(140,progress=>{ center.style.opacity=1-progress; });
        prepareFavorites();
        const destinations=[scentScene.querySelector('.scene-target'),...sceneFavorites].map(node=>{
          const rect=node.getBoundingClientRect();
          return {x:rect.left-bounds.left+rect.width/2,y:rect.top-bounds.top+rect.height/2,size:rect.width};
        });
        await motionFrames(780,progress=>{
          const ease=progress*progress*(3-2*progress);
          center.style.opacity=Math.max(0,(progress-.6)/.4);
          bottles.forEach((bottle,index)=>{
            const destination=destinations[index];
            const size=bottle.size+(destination.size-bottle.size)*ease;
            const x=bottle.x+(destination.x-bottle.x)*ease;
            const y=bottle.y+(destination.y-bottle.y)*ease;
            bottle.el.style.width=size+'px'; bottle.el.style.height=size+'px';
            bottle.el.style.transform=`translate3d(${x-size/2}px,${y-size/2}px,0)`;
            if(index===0) bottle.el.querySelector('img').style.transform=`scale(${1+.08*ease})`;
            else bottle.el.style.padding=(4*ease)+'px';
          });
        });
      } finally {
        overlay.remove(); center.style.removeProperty('opacity'); center.inert=false;
        center.classList.remove('is-returning'); comparing=false;
        focusSearch();
      }
    }
    document.getElementById('editFavorites').addEventListener('click',editFavorites);
    document.getElementById('resultBack').addEventListener('click',editFavorites);
  </script>
</body>
